<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ADMImob</title>

  <!-- Leaflet (cdnjs — CDN travado do projeto) -->
  <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>

  <!-- Turf.js (área em hectares) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Turf.js/6.5.0/turf.min.js"></script>

  <style>
    :root {
      --topo: #17191c;        /* barra superior e cabeçalho do painel */
      --primaria: #1b6e4b;    /* destaques: ativos, preços, botões */
      --secundaria: #0f4d33;  /* títulos e textos de apoio */
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    #app { display: flex; flex-direction: column; height: 100%; }

    header {
      position: relative;
      background: var(--topo);
      color: #fff;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: center;   /* ferramentas centralizadas */
      gap: 14px;
      z-index: 1000;
      box-shadow: 0 2px 6px rgba(0,0,0,.28);
    }
    .hdr-logo-wrap {
      display: none; /* aparece só quando o logo carrega */
      flex: none; width: 56px; height: 56px; border-radius: 12px;
      background: #fff; padding: 4px; box-sizing: border-box;
      align-items: center; justify-content: center;
    }
    .hdr-logo-wrap.tem-logo { display: flex; }
    .hdr-logo { max-width: 100%; max-height: 100%; display: block; }
    header .marca { font-weight: 700; font-size: 1.15rem; line-height: 1.15;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    header .corretor { font-size: .76rem; opacity: .85; font-weight: 400; }

    /* Quadro de usuário logado (destaque, na direita) */
    #user-badge {
      flex: none; display: flex; align-items: center; gap: 12px;
      background: rgba(255,255,255,.14); border: 1px solid rgba(255,255,255,.3);
      border-radius: 14px; padding: 7px 15px 7px 8px;
    }
    #user-badge .avatar {
      flex: none; width: 46px; height: 46px; border-radius: 50%; overflow: hidden;
      background: #fff; color: var(--secundaria); font-weight: 800; font-size: 1rem;
      display: flex; align-items: center; justify-content: center;
    }
    #user-badge .avatar img { display: none; width: 100%; height: 100%; object-fit: contain; }
    /* com logo do corretor: vira quadrado arredondado pra caber a marca inteira */
    #user-badge .avatar.tem-logo {
      border-radius: 12px; background: #000; border: 1px solid rgba(255,255,255,.25);
    }
    #user-badge .avatar.tem-logo img { display: block; }
    #user-badge .avatar.tem-logo #user-iniciais { display: none; }
    #user-badge .u-nome { font-weight: 700; font-size: 1rem; line-height: 1.2; white-space: nowrap; }
    #user-badge .u-creci { font-size: .75rem; opacity: .9; line-height: 1.3; white-space: nowrap; }
    #user-badge .u-status { display: flex; align-items: center; gap: 6px; font-size: .72rem; margin-top: 3px; }
    #user-badge .u-status .dot {
      width: 8px; height: 8px; border-radius: 50%; background: #38d66b;
      box-shadow: 0 0 0 3px rgba(56,214,107,.28);
    }
    /* Atalhos do cabeçalho (Filtros / Medir / Dados / Fundo / Camadas) */
    .hdr-right {
      position: absolute; right: 16px; top: 50%; transform: translateY(-50%);
      display: flex; align-items: center; gap: 12px;
    }
    .hdr-tools { display: flex; gap: 6px; }
    .tool { position: relative; }
    .tool-btn {
      display: flex; flex-direction: column; align-items: center; gap: 3px;
      background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.28);
      color: #fff; border-radius: 12px; padding: 7px 12px; cursor: pointer;
      min-width: 66px; line-height: 1;
    }
    .tool-btn:hover { background: rgba(255,255,255,.24); }
    .tool-btn.aberto { background: rgba(255,255,255,.28); }
    .tool-btn svg { width: 24px; height: 24px; }
    .tool-btn span { font-size: .68rem; font-weight: 600; white-space: nowrap; }
    .tool-pop {
      display: none; position: absolute; top: calc(100% + 8px); right: 0; z-index: 1200;
      background: #fff; border-radius: 12px; padding: 8px; min-width: 190px;
      box-shadow: 0 6px 20px rgba(0,0,0,.28);
    }
    .tool-pop.aberto { display: block; }
    @media (max-width: 720px) {
      .tool-btn span { display: none; }
      .tool-btn { min-width: 0; padding: 8px; }
    }
    @media (max-width: 900px) {
      /* espaço apertado: some o título e o logo do app, o usuário continua */
      .hdr-logo-wrap.tem-logo { display: none; }
    }
    @media (max-width: 620px) {
      #user-badge .u-info { display: none; }
      #user-badge { padding: 5px; }
      .hdr-right { gap: 8px; }
    }

    #conteudo { flex: 1; position: relative; min-height: 0; }
    #map { position: absolute; inset: 0; }

    /* Painel lateral esquerdo (drawer) */
    #painel-overlay {
      position: absolute; inset: 0; z-index: 1000; background: rgba(0,0,0,.35);
      opacity: 0; pointer-events: none; transition: opacity .25s;
    }
    #painel-overlay.aberto { opacity: 1; pointer-events: auto; }
    #painel {
      position: absolute; top: 0; left: 0; bottom: 0; z-index: 1001;
      width: 300px; max-width: 86vw; background: #fff;
      transform: translateX(-100%); transition: transform .28s ease;
      box-shadow: 2px 0 20px rgba(0,0,0,.28);
      display: flex; flex-direction: column; overflow-y: auto;
    }
    #painel.aberto { transform: translateX(0); }
    .painel-head {
      display: flex; align-items: center; justify-content: space-between;
      padding: 15px 16px; background: var(--topo); color: #fff;
      position: sticky; top: 0; z-index: 1;
    }
    .painel-head h2 { margin: 0; font-size: 1.05rem; }
    .painel-head .fechar {
      background: rgba(255,255,255,.2); border: none; color: #fff;
      width: 32px; height: 32px; border-radius: 50%; font-size: 1.2rem; cursor: pointer;
    }
    .painel-sec { padding: 16px; border-bottom: 1px solid #eef0ec; }
    .painel-sec > h3 {
      margin: 0 0 12px; font-size: .74rem; text-transform: uppercase;
      letter-spacing: .07em; color: var(--secundaria);
    }

    /* Filtros por chips (dentro do painel) */
    .chip-grupo { margin-bottom: 16px; }
    .chip-rot { font-size: .78rem; color: #666; font-weight: 600; margin-bottom: 8px; }
    .chips-filtro { display: flex; flex-wrap: wrap; gap: 7px; }
    .chip-f {
      border: 1px solid #d8ddd6; background: #fff; color: #333;
      border-radius: 20px; padding: 7px 14px; font-size: .84rem; cursor: pointer;
    }
    .chip-f:hover { background: #f4f7f2; }
    .chip-f.ativa { background: var(--primaria); color: #fff; border-color: var(--primaria); font-weight: 600; }
    .chip-f:focus-visible { outline: 2px solid var(--primaria); outline-offset: 2px; }
    .contador { font-size: .78rem; color: #555; margin-top: 4px; text-align: center; font-weight: 600; }

    /* Ficha do imóvel */
    #ficha {
      position: absolute; bottom: 0; left: 0; right: 0; z-index: 950;
      background: #fff; border-radius: 16px 16px 0 0;
      box-shadow: 0 -4px 20px rgba(0,0,0,.25);
      transform: translateY(100%); transition: transform .25s ease;
      display: flex; flex-direction: column; max-height: 80%;
    }
    #ficha.mostra { transform: translateY(0); }

    /* aba recolhida (peek) — visível quando um imóvel está selecionado */
    .ficha-tab {
      display: flex; align-items: center; gap: 10px;
      padding: 12px 14px; cursor: pointer; user-select: none; flex: none;
    }
    #ficha.aberta .ficha-tab { border-bottom: 1px solid #eee; }
    .ficha-tab-info { flex: 1; min-width: 0; }
    .ficha-tab-titulo {
      font-weight: 700; font-size: 1rem;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .ficha-tab-meta { display: flex; align-items: baseline; gap: 10px; margin-top: 2px; }
    .ficha-tab-meta .ref { margin: 0; }
    .tab-preco { color: var(--primaria); font-weight: 700; font-size: .92rem; white-space: nowrap; }
    .chevron { color: #999; font-size: 1rem; transition: transform .25s ease; flex: none; }
    #ficha.aberta .chevron { transform: rotate(180deg); }
    .ficha-tab .fechar {
      flex: none; background: #eee; color: #555; border: none;
      width: 30px; height: 30px; border-radius: 50%; font-size: 1.05rem; cursor: pointer;
    }

    /* detalhe expandido */
    .ficha-detalhe { display: none; }
    #ficha.aberta .ficha-detalhe { display: block; max-height: 64vh; overflow-y: auto; }
    #ficha .foto { width: 100%; height: 200px; object-fit: cover; display: block; background: #eee; }
    #ficha .corpo { padding: 12px 16px 20px; }
    #ficha .preco { color: var(--primaria); font-weight: 700; font-size: 1.25rem; margin: 6px 0; }
    #ficha .endereco { color: #555; font-size: .85rem; margin-bottom: 10px; }
    #ficha .ref {
      font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
      font-size: .72rem; color: #888; margin: 8px 0 2px; letter-spacing: .02em;
    }
    #ficha .badges { margin-bottom: 10px; }
    #ficha .badge {
      display: inline-block; font-size: .7rem; padding: 2px 8px; border-radius: 20px;
      background: #eef4f0; color: var(--secundaria); margin-right: 6px; text-transform: uppercase; letter-spacing: .03em;
    }
    #ficha .specs { list-style: none; padding: 0; margin: 12px 0; display: grid; grid-template-columns: 1fr 1fr; gap: 6px 12px; }
    #ficha .specs li { font-size: .82rem; color: #333; border-bottom: 1px solid #f0f0f0; padding-bottom: 4px; }
    #ficha .specs li span { color: #888; display: block; font-size: .68rem; text-transform: uppercase; }

    .contatos { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
    .contatos a {
      flex: 1 1 45%; text-align: center; text-decoration: none; padding: 10px;
      border-radius: 10px; font-size: .85rem; font-weight: 600; color: #fff;
    }
    .c-whats { background: #25d366; }
    .c-tel   { background: var(--secundaria); }
    .c-email { background: #555; }
    .c-insta { background: #d6336c; }
    .rota-btn {
      display: block; width: 100%; margin-top: 10px; padding: 11px;
      background: var(--primaria); color: #fff; border: none; border-radius: 10px;
      font-size: .9rem; font-weight: 600; cursor: pointer;
    }

    /* Camadas de referência (popover Camadas) */
    .ref-lista { display: flex; flex-direction: column; gap: 4px; }
    .ref-op {
      display: flex; align-items: center; gap: 9px; cursor: pointer;
      padding: 9px 10px; border-radius: 8px; font-size: .87rem; color: #333;
    }
    .ref-op:hover { background: #f4f7f2; }
    .ref-op input { width: 17px; height: 17px; accent-color: var(--primaria); cursor: pointer; flex: none; }
    .ref-cor { width: 12px; height: 12px; border-radius: 3px; flex: none; border: 1px solid rgba(0,0,0,.15); }
    .ref-nome { flex: 1; }
    .ref-status { font-size: .7rem; color: #999; }

    /* Exportar dados (popover Dados) */
    .exp-lista { display: flex; flex-direction: column; gap: 7px; }
    .exp-op {
      display: block; width: 100%; text-align: left; cursor: pointer;
      background: #f4f7f2; border: 1px solid #e2e8e2; border-radius: 9px;
      padding: 11px 13px; font-size: .88rem; color: #333;
    }
    .exp-op:hover { background: #eaf0ea; }
    .exp-op:focus-visible { outline: 2px solid var(--primaria); outline-offset: 2px; }
    .exp-nota { font-size: .7rem; color: #888; text-align: center; margin-top: 8px; }

    /* Camadas (lista dentro do painel) */
    .cam-lista { display: flex; flex-direction: column; gap: 7px; }
    .cam-op {
      display: block; width: 100%; text-align: left; cursor: pointer;
      background: #f4f7f2; border: 1px solid #e2e8e2; border-radius: 9px;
      padding: 11px 13px; font-size: .88rem; color: #333;
    }
    .cam-op:hover { background: #eaf0ea; }
    .cam-op.ativa { background: var(--primaria); color: #fff; font-weight: 600; border-color: var(--primaria); }
    .cam-op:focus-visible { outline: 2px solid var(--primaria); outline-offset: 2px; }

    /* Medição (botões dentro do painel) */
    #medir-tools { display: flex; flex-direction: column; gap: 8px; }
    #medir-tools button {
      width: 100%; text-align: left; cursor: pointer;
      background: #f4f7f2; border: 1px solid #e2e8e2; border-radius: 9px;
      padding: 11px 13px; font-size: .88rem; color: #333;
    }
    #medir-tools button:hover { background: #eaf0ea; }
    #medir-tools button.ativo { background: var(--primaria); color: #fff; font-weight: 600; border-color: var(--primaria); }

    #med-readout {
      position: absolute; top: 90px; left: 50%; transform: translateX(-50%);
      z-index: 910; background: #fff; border-radius: 12px; padding: 10px 14px;
      box-shadow: 0 4px 16px rgba(0,0,0,.25); display: none;
      max-width: calc(100vw - 100px); text-align: center;
    }
    #med-readout-txt { font-size: .95rem; font-weight: 700; color: var(--secundaria); }
    #med-readout .med-acoes { display: flex; gap: 8px; margin-top: 8px; justify-content: center; }
    #med-readout .med-acoes button {
      border: none; border-radius: 8px; padding: 6px 12px; font-size: .78rem; cursor: pointer;
    }
    #med-desfazer { background: #eee; color: #333; }
    #med-fechar { background: var(--primaria); color: #fff; }

    .leaflet-popup-content { font-size: .85rem; }
    .erro-carga {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
      background: #fff; padding: 16px 20px; border-radius: 10px; z-index: 1200;
      box-shadow: 0 4px 16px rgba(0,0,0,.3); max-width: 300px; text-align: center; font-size: .9rem; color: #b00;
    }
  </style>
</head>
<body>
  <div id="app">
    <header>
      <div class="hdr-tools">
          <div class="tool">
            <button class="tool-btn" id="menu-toggle" aria-label="Abrir filtros" aria-expanded="false">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M4 6.5h16M6.5 12h11M10 17.5h4"/>
              </svg>
              <span>Filtros</span>
            </button>
          </div>

          <div class="tool">
            <button class="tool-btn" id="btn-medir" aria-expanded="false" aria-haspopup="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <rect x="2.5" y="8.5" width="19" height="7" rx="1.5"/>
                <line x1="6" y1="8.5" x2="6" y2="11.5"/>
                <line x1="9.5" y1="8.5" x2="9.5" y2="12.5"/>
                <line x1="13" y1="8.5" x2="13" y2="11.5"/>
                <line x1="16.5" y1="8.5" x2="16.5" y2="12.5"/>
                <line x1="20" y1="8.5" x2="20" y2="11.5"/>
              </svg>
              <span>Medir</span>
            </button>
            <div class="tool-pop" id="pop-medir" role="menu">
              <div id="medir-tools">
                <button id="med-dist" type="button">📏 Medir distância</button>
                <button id="med-area" type="button">△ Medir área</button>
              </div>
            </div>
          </div>

          <div class="tool">
            <button class="tool-btn" id="btn-dados" aria-expanded="false" aria-haspopup="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <rect x="3" y="3" width="18" height="10" rx="1.5"/>
                <path d="M3 6.8h18M9.4 3v10M15 3v10"/>
                <path d="M12 15v6M9.2 18.4 12 21.2l2.8-2.8"/>
              </svg>
              <span>Dados</span>
            </button>
            <div class="tool-pop" id="pop-dados" role="menu">
              <div class="exp-lista">
                <button type="button" class="exp-op" id="exp-csv">📊 Excel (CSV)</button>
                <button type="button" class="exp-op" id="exp-kml">🌍 KML (Google Earth)</button>
              </div>
              <div class="exp-nota">Backup do catálogo completo</div>
            </div>
          </div>

          <div class="tool">
            <button class="tool-btn" id="btn-fundo" aria-expanded="false" aria-haspopup="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M3 6.5 L9 4 L15 6.5 L21 4 V13 L15 15.5 L9 13 L3 15.5 Z"/>
                <path d="M9 4 V13 M15 6.5 V15.5"/>
                <path d="M5.5 19.5 C7.7 17.3 16.3 17.3 18.5 19.5 C16.3 21.7 7.7 21.7 5.5 19.5 Z"/>
                <circle cx="12" cy="19.5" r="1.4"/>
              </svg>
              <span>Fundo do mapa</span>
            </button>
            <div class="tool-pop" id="pop-fundo" role="menu">
              <div class="cam-lista">
                <button type="button" class="cam-op" data-modo="satelite">Satélite</button>
                <button type="button" class="cam-op" data-modo="hibrido">Satélite + Ruas</button>
                <button type="button" class="cam-op" data-modo="ruas">Somente Ruas</button>
              </div>
            </div>
          </div>

          <div class="tool">
            <button class="tool-btn" id="btn-camadas" aria-expanded="false" aria-haspopup="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M12 2.5 21.5 7 12 11.5 2.5 7z"/>
                <path d="M2.5 12 12 16.5 21.5 12"/>
                <path d="M2.5 17 12 21.5 21.5 17"/>
              </svg>
              <span>Camadas</span>
            </button>
            <div class="tool-pop" id="pop-camadas" role="menu">
              <div class="ref-lista" id="ref-lista"></div>
              <div class="exp-nota" id="ref-vazio">Nenhuma camada de referência configurada</div>
            </div>
          </div>
        </div>

      <div class="hdr-right">
        <span class="hdr-logo-wrap" id="hdr-logo-wrap">
          <img class="hdr-logo" id="hdr-logo" alt="" />
        </span>
        <div id="user-badge" title="Usuário logado">
          <span class="avatar" id="user-avatar">
            <span id="user-iniciais">?</span>
            <img id="user-logo" alt="" />
          </span>
          <div class="u-info">
            <div class="u-nome" id="user-nome">Usuário</div>
            <div class="u-creci" id="user-creci"></div>
            <div class="u-status"><span class="dot"></span>Logado</div>
          </div>
        </div>
      </div>
    </header>

    <div id="conteudo">
      <div id="map"></div>

      <div id="painel-overlay"></div>
      <aside id="painel" aria-label="Menu de funcionalidades">
        <div class="painel-head">
          <h2>Filtros</h2>
          <button class="fechar" id="painel-fechar" aria-label="Fechar menu">×</button>
        </div>

        <div class="painel-sec">
          <h3>Filtrar imóveis</h3>
          <div id="filtros">
            <div class="chip-grupo">
              <div class="chip-rot">Negócio</div>
              <div class="chips-filtro" id="filtro-negocio">
                <button type="button" class="chip-f ativa" data-val="">Todos</button>
                <button type="button" class="chip-f" data-val="venda">Venda</button>
                <button type="button" class="chip-f" data-val="aluguel">Aluguel</button>
              </div>
            </div>
            <div class="chip-grupo">
              <div class="chip-rot">Tipo</div>
              <div class="chips-filtro" id="filtro-tipo">
                <button type="button" class="chip-f ativa" data-val="">Todos</button>
                <button type="button" class="chip-f" data-val="casa">Casa</button>
                <button type="button" class="chip-f" data-val="comercial">Comercial</button>
                <button type="button" class="chip-f" data-val="terreno">Terreno</button>
                <button type="button" class="chip-f" data-val="fazenda">Fazenda</button>
                <button type="button" class="chip-f" data-val="chacara">Chácara</button>
              </div>
            </div>
            <div class="contador" id="contador"></div>
          </div>
        </div>
      </aside>

      <div id="med-readout">
        <span id="med-readout-txt"></span>
        <div class="med-acoes">
          <button id="med-desfazer">Desfazer</button>
          <button id="med-fechar">Fechar</button>
        </div>
      </div>

      <div id="ficha">
        <div class="ficha-tab" id="ficha-tab" role="button" tabindex="0" aria-expanded="false">
          <div class="ficha-tab-info">
            <div class="ficha-tab-titulo" id="tab-titulo"></div>
            <div class="ficha-tab-meta">
              <span class="ref" id="tab-codigo"></span>
              <span class="tab-preco" id="tab-preco"></span>
            </div>
          </div>
          <span class="chevron" id="ficha-chevron" aria-hidden="true">⌃</span>
          <button class="fechar" id="ficha-fechar" aria-label="Fechar">×</button>
        </div>
        <div class="ficha-detalhe" id="ficha-detalhe">
          <img class="foto" id="ficha-foto" alt="" />
          <div class="corpo" id="ficha-corpo"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Ao editar o config.js (contatos, camadas, novo corretor), aumente o ?v=
       para o navegador do corretor pegar a versão nova em vez do cache. -->
  <script src="config.js?v=4"></script>
  <script>
  (function () {
    "use strict";

    // ---- 1. Descobrir qual corretor carregar (?cliente=slug) ----
    const params = new URLSearchParams(location.search);
    const slug = params.get("cliente") || CLIENTE_PADRAO;
    const cliente = CLIENTES[slug];

    if (!cliente) {
      document.body.innerHTML =
        '<div class="erro-carga">Corretor "' + slug + '" não encontrado. ' +
        'Verifique o link ou o config.js.</div>';
      return;
    }

    // ---- 2. Aplicar marca / cores / título ----
    const raiz = document.documentElement.style;
    raiz.setProperty("--topo", cliente.corTopo || cliente.corPrimaria || "#17191c");
    raiz.setProperty("--primaria", cliente.corPrimaria || "#1b6e4b");
    raiz.setProperty("--secundaria", cliente.corSecundaria || "#0f4d33");
    document.title = cliente.marca || "ADMImob";
    document.getElementById("user-creci").textContent = cliente.creci || "";

    // Quadro de usuário logado (nome + iniciais, ou o logo do corretor)
    const nomeUsuario = cliente.corretor || "Usuário";
    document.getElementById("user-nome").textContent = nomeUsuario;
    const iniciais = nomeUsuario.trim().split(/\s+/).map(function (p) { return p[0]; })
      .slice(0, 2).join("").toUpperCase();
    document.getElementById("user-iniciais").textContent = iniciais || "?";

    // Logo do corretor no avatar (se o arquivo carregar; senão fica nas iniciais)
    if (cliente.logoUsuario) {
      const avatarEl = document.getElementById("user-avatar");
      const logoUsr = document.getElementById("user-logo");
      logoUsr.alt = nomeUsuario;
      logoUsr.onload = function () { avatarEl.classList.add("tem-logo"); };
      logoUsr.onerror = function () { avatarEl.classList.remove("tem-logo"); };
      logoUsr.src = cliente.logoUsuario;
    }

    // Logo do cabeçalho: só aparece se o arquivo carregar
    if (cliente.logo) {
      const logoImg = document.getElementById("hdr-logo");
      const logoWrap = document.getElementById("hdr-logo-wrap");
      logoImg.alt = cliente.marca || "Logo";
      logoImg.onload = function () { logoWrap.classList.add("tem-logo"); };
      logoImg.onerror = function () { logoWrap.classList.remove("tem-logo"); };
      logoImg.src = cliente.logo;
    }

    // ---- 3. Mapa base (satélite Esri, uso livre) ----
    const map = L.map("map", { zoomControl: true })
      .setView(cliente.centro || [-19.11, -51.73], cliente.zoom || 13);

    const ESRI = "https://server.arcgisonline.com/ArcGIS/rest/services/";
    const attrEsri = "Tiles © Esri";

    // Satélite (imagem só tem até zoom 17 nesta região; acima disso amplia a do 17)
    const baseSatelite = L.tileLayer(ESRI + "World_Imagery/MapServer/tile/{z}/{y}/{x}",
      { maxZoom: 19, maxNativeZoom: 17, attribution: attrEsri + " — Maxar, Earthstar Geographics" });
    // Somente ruas
    const baseRuas = L.tileLayer(ESRI + "World_Street_Map/MapServer/tile/{z}/{y}/{x}",
      { maxZoom: 19, attribution: attrEsri + ", HERE, Garmin, OpenStreetMap" });
    // Overlay transparente (ruas + nomes) para o modo híbrido
    const refRuas = L.layerGroup([
      L.tileLayer(ESRI + "Reference/World_Transportation/MapServer/tile/{z}/{y}/{x}", { maxZoom: 19, maxNativeZoom: 17 }),
      L.tileLayer(ESRI + "Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}", { maxZoom: 19, maxNativeZoom: 17 })
    ]);

    function trocarCamada(modo) {
      map.removeLayer(baseSatelite);
      map.removeLayer(baseRuas);
      map.removeLayer(refRuas);
      if (modo === "ruas") {
        baseRuas.addTo(map);
      } else {
        baseSatelite.addTo(map);
        if (modo === "hibrido") refRuas.addTo(map);
      }
      document.querySelectorAll(".cam-op").forEach(function (b) {
        b.classList.toggle("ativa", b.dataset.modo === modo);
      });
    }
    trocarCamada("satelite"); // camada inicial

    // ---- Atalhos do cabeçalho: popovers Medir / Fundo do mapa ----
    const btnMedir = document.getElementById("btn-medir");
    const btnFundo = document.getElementById("btn-fundo");
    const btnDados = document.getElementById("btn-dados");
    const btnCamadas = document.getElementById("btn-camadas");
    const popMedir = document.getElementById("pop-medir");
    const popFundo = document.getElementById("pop-fundo");
    const popDados = document.getElementById("pop-dados");
    const popCamadas = document.getElementById("pop-camadas");

    function fecharPopovers() {
      [[btnMedir, popMedir], [btnDados, popDados], [btnFundo, popFundo],
       [btnCamadas, popCamadas]].forEach(function (par) {
        par[0].classList.remove("aberto"); par[0].setAttribute("aria-expanded", "false");
        par[1].classList.remove("aberto");
      });
    }
    function alternarPop(btn, pop) {
      const abrir = !pop.classList.contains("aberto");
      fecharPopovers();
      if (abrir) { pop.classList.add("aberto"); btn.classList.add("aberto"); btn.setAttribute("aria-expanded", "true"); }
    }
    btnMedir.addEventListener("click", function (e) { e.stopPropagation(); alternarPop(btnMedir, popMedir); });
    btnDados.addEventListener("click", function (e) { e.stopPropagation(); alternarPop(btnDados, popDados); });
    btnFundo.addEventListener("click", function (e) { e.stopPropagation(); alternarPop(btnFundo, popFundo); });
    btnCamadas.addEventListener("click", function (e) { e.stopPropagation(); alternarPop(btnCamadas, popCamadas); });
    document.addEventListener("click", function (e) {
      if (!e.target.closest(".tool")) fecharPopovers();
    });

    // troca de camada (fecha o popover ao escolher)
    document.querySelectorAll(".cam-op").forEach(function (b) {
      b.addEventListener("click", function () { trocarCamada(b.dataset.modo); fecharPopovers(); });
    });

    // ---- Camadas de referência (bairros, ruas, fazendas, pontos...) ----
    // painel próprio, abaixo dos imóveis do catálogo
    map.createPane("refs");
    map.getPane("refs").style.zIndex = 350;

    const refsCarregadas = {};           // índice -> layer já baixada
    const camadasRef = cliente.camadas || [];
    const refLista = document.getElementById("ref-lista");

    if (camadasRef.length) {
      document.getElementById("ref-vazio").style.display = "none";
    }

    camadasRef.forEach(function (c, i) {
      const cor = c.cor || "#e8a33d";
      const linha = document.createElement("label");
      linha.className = "ref-op";

      const chk = document.createElement("input");
      chk.type = "checkbox";
      const bolinha = document.createElement("span");
      bolinha.className = "ref-cor";
      bolinha.style.background = cor;
      const nome = document.createElement("span");
      nome.className = "ref-nome";
      nome.textContent = c.nome || ("Camada " + (i + 1));
      const status = document.createElement("span");
      status.className = "ref-status";

      linha.appendChild(chk); linha.appendChild(bolinha);
      linha.appendChild(nome); linha.appendChild(status);
      refLista.appendChild(linha);

      chk.addEventListener("change", function () {
        if (!chk.checked) {
          if (refsCarregadas[i]) map.removeLayer(refsCarregadas[i]);
          status.textContent = "";
          return;
        }
        if (refsCarregadas[i]) { refsCarregadas[i].addTo(map); return; }

        status.textContent = "carregando…";
        fetch(c.arquivo, { cache: "no-cache" })
          .then(function (r) {
            if (!r.ok) throw new Error("HTTP " + r.status);
            return r.json();
          })
          .then(function (gj) {
            refsCarregadas[i] = L.geoJSON(gj, {
              pane: "refs",
              style: function () {
                return { color: cor, weight: 2, opacity: .9, fillOpacity: 0.12 };
              },
              pointToLayer: function (feat, latlng) {
                return L.circleMarker(latlng, {
                  pane: "refs", radius: 6, color: "#fff", weight: 2,
                  fillColor: cor, fillOpacity: 1
                });
              },
              onEachFeature: function (feat, lyr) {
                const p = feat.properties || {};
                const txt = p[c.rotulo] || p.nome || p.name || p.NOME || "";
                if (txt) lyr.bindTooltip(String(txt), { direction: "top", sticky: true });
              }
            }).addTo(map);
            status.textContent = "";
          })
          .catch(function (err) {
            status.textContent = "erro";
            chk.checked = false;
            alert('Não consegui carregar a camada "' + (c.nome || "") + '".\n' +
                  "Confira o caminho no config.js (" + c.arquivo + ") — " + err.message);
          });
      });
    });

    // ---- 4. Estado ----
    let todasFeatures = [];
    const layerImoveis = L.layerGroup().addTo(map);
    let rotaLayer = null;
    let posUsuario = null;
    let modoMedicao = null; // null | "distancia" | "area"

    const TIPO_LABEL = {
      casa: "Casa", comercial: "Comercial", terreno: "Terreno",
      fazenda: "Fazenda", chacara: "Chácara"
    };
    const rotuloTipo = function (t) { return TIPO_LABEL[t] || t || "imóvel"; };
    const rotuloNegocio = function (n) {
      return n === "venda" ? "Venda" : n === "aluguel" ? "Aluguel" : (n || "");
    };

    const fmtBRL = function (v) {
      return (v || 0).toLocaleString("pt-BR", { style: "currency", currency: "BRL", maximumFractionDigits: 0 });
    };

    // linha do código do imóvel no popup (só se houver)
    const refPopup = function (p) {
      return p.codigo
        ? '<br><span style="font-family:monospace;font-size:.68rem;color:#888">' + p.codigo + '</span>'
        : '';
    };

    // ---- 5. Carregar GeoJSON do corretor ----
    fetch(cliente.dados, { cache: "no-cache" }) // revalida sempre: catálogo atualizado aparece na hora
      .then(function (r) {
        if (!r.ok) throw new Error("HTTP " + r.status);
        return r.json();
      })
      .then(function (gj) {
        todasFeatures = (gj.features || []);
        aplicarFiltros();
      })
      .catch(function (e) {
        const div = document.createElement("div");
        div.className = "erro-carga";
        div.textContent = "Não foi possível carregar os imóveis (" + e.message +
          "). Se estiver abrindo o arquivo direto do PC, publique no GitHub Pages — fetch não funciona em file://";
        document.getElementById("conteudo").appendChild(div);
      });

    // ---- 6. Renderizar features no mapa ----
    function render(features) {
      layerImoveis.clearLayers();

      features.forEach(function (f) {
        const p = f.properties || {};
        const g = f.geometry || {};

        if (g.type === "Point") {
          const ll = [g.coordinates[1], g.coordinates[0]];
          const m = L.marker(ll).addTo(layerImoveis);
          m.bindPopup("<b>" + (p.titulo || "Imóvel") + "</b><br>" + fmtBRL(p.preco) + refPopup(p));
          m.on("click", function () { abrirFicha(f); });
        } else if (g.type === "Polygon" || g.type === "MultiPolygon") {
          const poly = L.geoJSON(f, {
            style: {
              color: cliente.corPrimaria || "#1b6e4b",
              weight: 2, fillOpacity: 0.25
            }
          }).addTo(layerImoveis);
          const ha = areaHectares(f);
          poly.bindPopup("<b>" + (p.titulo || "Área") + "</b><br>" +
            fmtBRL(p.preco) + "<br>" + ha.toFixed(1) + " ha" + refPopup(p));
          poly.on("click", function () { abrirFicha(f, ha); });
        }
      });
    }

    function areaHectares(f) {
      try {
        return turf.area(f) / 10000; // m² → ha
      } catch (e) {
        return 0;
      }
    }

    // ---- 7. Filtros por chips (Negócio / Tipo) ----
    function filtroAtivo(grupoId) {
      const el = document.querySelector("#" + grupoId + " .chip-f.ativa");
      return el ? el.dataset.val : "";
    }

    function aplicarFiltros() {
      const negocio = filtroAtivo("filtro-negocio");
      const tipo = filtroAtivo("filtro-tipo");

      const filtradas = todasFeatures.filter(function (f) {
        const p = f.properties || {};
        if (negocio && p.negocio !== negocio) return false;
        if (tipo && p.tipo !== tipo) return false;
        return true;
      });

      render(filtradas);
      document.getElementById("contador").textContent =
        filtradas.length + " de " + todasFeatures.length + " imóveis";
    }

    // tocar num chip: seleciona (um por grupo) e filtra na hora
    document.querySelectorAll(".chips-filtro").forEach(function (grupo) {
      grupo.querySelectorAll(".chip-f").forEach(function (chip) {
        chip.addEventListener("click", function () {
          grupo.querySelectorAll(".chip-f").forEach(function (c) { c.classList.remove("ativa"); });
          chip.classList.add("ativa");
          aplicarFiltros();
        });
      });
    });
    // ---- Painel lateral (abrir/fechar) ----
    const painel = document.getElementById("painel");
    const painelOverlay = document.getElementById("painel-overlay");
    const menuToggle = document.getElementById("menu-toggle");
    function abrirPainel() {
      painel.classList.add("aberto");
      painelOverlay.classList.add("aberto");
      menuToggle.setAttribute("aria-expanded", "true");
    }
    function fecharPainel() {
      painel.classList.remove("aberto");
      painelOverlay.classList.remove("aberto");
      menuToggle.setAttribute("aria-expanded", "false");
    }
    menuToggle.addEventListener("click", abrirPainel);
    painelOverlay.addEventListener("click", fecharPainel);
    document.getElementById("painel-fechar").addEventListener("click", fecharPainel);

    // ---- 8. Ficha do imóvel ----
    const ficha = document.getElementById("ficha");

    function abrirFicha(f, ha) {
      if (modoMedicao) return; // medindo: não abrir ficha
      const p = f.properties || {};

      // aba recolhida (peek): título + código + preço
      document.getElementById("tab-titulo").textContent = p.titulo || "Imóvel";
      document.getElementById("tab-codigo").textContent = p.codigo ? "Cód. " + p.codigo : "";
      document.getElementById("tab-preco").textContent =
        fmtBRL(p.preco) + (p.negocio === "aluguel" ? " /mês" : "");

      // detalhe (expandido)
      const foto = document.getElementById("ficha-foto");
      foto.src = p.foto || "https://placehold.co/600x400?text=Sem+foto";
      foto.alt = p.titulo || "";

      const specs = Object.keys(p)
        .filter(function (k) { return k.indexOf("spec_") === 0 && p[k]; })
        .map(function (k) {
          const rotulo = k.replace("spec_", "").replace(/_/g, " ");
          return '<li><span>' + rotulo + '</span>' + p[k] + '</li>';
        });

      if (ha) {
        specs.unshift('<li><span>área</span>' + ha.toFixed(1) + ' ha</li>');
      }

      document.getElementById("ficha-corpo").innerHTML =
        '<div class="badges">' +
          '<span class="badge">' + rotuloTipo(p.tipo) + '</span>' +
          '<span class="badge">' + rotuloNegocio(p.negocio) + '</span>' +
        '</div>' +
        '<div class="endereco">' + (p.endereco || "") + '</div>' +
        (specs.length ? '<ul class="specs">' + specs.join("") + '</ul>' : '');

      ficha.classList.add("mostra");
      ficha.classList.remove("aberta"); // começa recolhida
      document.getElementById("ficha-tab").setAttribute("aria-expanded", "false");
    }

    // aba: clicar alterna entre recolhida e expandida
    const fichaTab = document.getElementById("ficha-tab");
    function alternarFicha() {
      const aberta = ficha.classList.toggle("aberta");
      fichaTab.setAttribute("aria-expanded", aberta ? "true" : "false");
    }
    fichaTab.addEventListener("click", function (e) {
      if (e.target.closest("#ficha-fechar")) return; // o × fecha, não alterna
      alternarFicha();
    });
    fichaTab.addEventListener("keydown", function (e) {
      if (e.key === "Enter" || e.key === " ") { e.preventDefault(); alternarFicha(); }
    });

    document.getElementById("ficha-fechar").addEventListener("click", function (e) {
      e.stopPropagation();
      ficha.classList.remove("mostra", "aberta");
    });

    // ---- 9. Rota real por estrada (OSRM público, fallback linha reta) ----
    function destinoDaFeature(f) {
      const g = f.geometry || {};
      if (g.type === "Point") return [g.coordinates[1], g.coordinates[0]];
      // polígono → centróide
      try {
        const c = turf.centroid(f).geometry.coordinates;
        return [c[1], c[0]];
      } catch (e) {
        return null;
      }
    }

    function tracarRota(f) {
      const destino = destinoDaFeature(f);
      if (!destino) return;

      function desenhar(coords, cor) {
        if (rotaLayer) map.removeLayer(rotaLayer);
        rotaLayer = L.polyline(coords, { color: cor, weight: 4, opacity: .8 }).addTo(map);
        map.fitBounds(rotaLayer.getBounds(), { padding: [40, 40] });
      }

      function comOrigem(origem) {
        posUsuario = origem;
        const url = "https://router.project-osrm.org/route/v1/driving/" +
          origem[1] + "," + origem[0] + ";" + destino[1] + "," + destino[0] +
          "?overview=full&geometries=geojson";
        fetch(url)
          .then(function (r) { return r.json(); })
          .then(function (data) {
            if (data.routes && data.routes[0]) {
              const linha = data.routes[0].geometry.coordinates.map(function (c) { return [c[1], c[0]]; });
              desenhar(linha, cliente.corPrimaria || "#1b6e4b");
            } else {
              desenhar([origem, destino], "#888"); // fallback linha reta
            }
          })
          .catch(function () {
            desenhar([origem, destino], "#888");
          });
      }

      if (posUsuario) {
        comOrigem(posUsuario);
      } else if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
          function (pos) { comOrigem([pos.coords.latitude, pos.coords.longitude]); },
          function () {
            alert("Não consegui pegar sua localização. Ative o GPS e permita o acesso (funciona só em https).");
          }
        );
      } else {
        alert("Seu navegador não suporta geolocalização.");
      }
    }

    // ---- 10. Medição (distância / área) via Turf ----
    const medLayer = L.layerGroup().addTo(map);
    let medPontos = []; // array de L.latLng

    function entrarModo(modo) {
      if (modoMedicao === modo) { sairMedicao(); return; }
      ficha.classList.remove("aberta");
      fecharPainel(); // fecha o painel pra liberar o clique no mapa
      fecharPopovers(); // fecha o popover Medir
      modoMedicao = modo;
      medPontos = [];
      document.getElementById("med-dist").classList.toggle("ativo", modo === "distancia");
      document.getElementById("med-area").classList.toggle("ativo", modo === "area");
      document.getElementById("med-readout").style.display = "block";
      map.getContainer().style.cursor = "crosshair";
      atualizarMedicao();
    }

    function sairMedicao() {
      modoMedicao = null;
      medPontos = [];
      medLayer.clearLayers();
      document.getElementById("med-dist").classList.remove("ativo");
      document.getElementById("med-area").classList.remove("ativo");
      document.getElementById("med-readout").style.display = "none";
      map.getContainer().style.cursor = "";
    }

    map.on("click", function (e) {
      if (!modoMedicao) return;
      medPontos.push(e.latlng);
      atualizarMedicao();
    });

    function atualizarMedicao() {
      medLayer.clearLayers();
      const cor = cliente.corPrimaria || "#1b6e4b";

      medPontos.forEach(function (ll) {
        L.circleMarker(ll, {
          radius: 5, color: "#fff", weight: 2, fillColor: cor, fillOpacity: 1
        }).addTo(medLayer);
      });

      const txt = document.getElementById("med-readout-txt");

      if (modoMedicao === "distancia") {
        if (medPontos.length >= 2) {
          L.polyline(medPontos, { color: cor, weight: 3, dashArray: "6,6" }).addTo(medLayer);
          const coords = medPontos.map(function (ll) { return [ll.lng, ll.lat]; });
          const metros = turf.length(turf.lineString(coords), { units: "kilometers" }) * 1000;
          txt.textContent = "Distância: " + fmtMetros(metros);
        } else {
          txt.textContent = "Toque em 2+ pontos no mapa";
        }
      } else if (modoMedicao === "area") {
        if (medPontos.length >= 3) {
          L.polygon(medPontos, { color: cor, weight: 2, fillOpacity: 0.2, dashArray: "6,6" }).addTo(medLayer);
          const coords = medPontos.map(function (ll) { return [ll.lng, ll.lat]; });
          coords.push(coords[0]); // fecha o anel
          const m2 = turf.area(turf.polygon([coords]));
          txt.textContent = "Área: " + fmtArea(m2);
        } else {
          txt.textContent = "Toque em 3+ pontos no mapa";
        }
      }
    }

    function fmtMetros(m) {
      if (m >= 1000) {
        return (m / 1000).toLocaleString("pt-BR", { maximumFractionDigits: 2 }) +
          " km (" + Math.round(m).toLocaleString("pt-BR") + " m)";
      }
      return Math.round(m).toLocaleString("pt-BR") + " m";
    }

    function fmtArea(m2) {
      const ha = m2 / 10000;
      if (m2 >= 10000) {
        return ha.toLocaleString("pt-BR", { maximumFractionDigits: 2 }) +
          " ha (" + Math.round(m2).toLocaleString("pt-BR") + " m²)";
      }
      return Math.round(m2).toLocaleString("pt-BR") + " m²";
    }

    document.getElementById("med-dist").addEventListener("click", function () { entrarModo("distancia"); });
    document.getElementById("med-area").addEventListener("click", function () { entrarModo("area"); });
    document.getElementById("med-fechar").addEventListener("click", sairMedicao);
    document.getElementById("med-desfazer").addEventListener("click", function () {
      medPontos.pop();
      atualizarMedicao();
    });

    // ---- 11. Exportar dados (backup): Excel/CSV e KML ----
    function baixarArquivo(nome, conteudo, mime) {
      const blob = new Blob([conteudo], { type: mime });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = nome;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
    }

    function nomeArquivo(ext) {
      const d = new Date();
      const data = d.getFullYear() + "-" +
        String(d.getMonth() + 1).padStart(2, "0") + "-" +
        String(d.getDate()).padStart(2, "0");
      return "ADMImob_" + slug + "_" + data + "." + ext;
    }

    // centro da feature: o próprio ponto, ou o centróide do polígono
    function centroFeature(f) {
      const g = f.geometry || {};
      if (g.type === "Point") return [g.coordinates[1], g.coordinates[0]];
      try {
        const c = turf.centroid(f).geometry.coordinates;
        return [c[1], c[0]];
      } catch (e) { return [null, null]; }
    }

    function chavesSpec(feats) {
      const specs = [];
      feats.forEach(function (f) {
        Object.keys(f.properties || {}).forEach(function (k) {
          if (k.indexOf("spec_") === 0 && specs.indexOf(k) === -1) specs.push(k);
        });
      });
      return specs.sort();
    }

    function exportarCSV() {
      const feats = todasFeatures;
      if (!feats.length) { alert("Nenhum imóvel carregado para exportar."); return; }
      const specs = chavesSpec(feats);

      const cab = ["Código", "Título", "Tipo", "Negócio", "Preço", "Endereço",
                   "Latitude", "Longitude", "Área (ha)"]
        .concat(specs.map(function (k) { return k.replace("spec_", "").replace(/_/g, " "); }));

      // separador ";" e vírgula decimal = padrão do Excel em pt-BR
      function esc(v) {
        const s = (v === undefined || v === null) ? "" : String(v);
        return /[";\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
      }
      function num(v) {
        return (v === null || v === undefined || v === "") ? "" : String(v).replace(".", ",");
      }

      const linhas = [cab.map(esc).join(";")];
      feats.forEach(function (f) {
        const p = f.properties || {};
        const g = f.geometry || {};
        const c = centroFeature(f);
        const ha = (g.type === "Polygon" || g.type === "MultiPolygon")
          ? num(areaHectares(f).toFixed(2)) : "";
        const linha = [
          p.codigo, p.titulo, rotuloTipo(p.tipo), rotuloNegocio(p.negocio),
          p.preco, p.endereco, num(c[0]), num(c[1]), ha
        ].concat(specs.map(function (k) { return p[k]; }));
        linhas.push(linha.map(esc).join(";"));
      });

      // BOM (﻿) faz o Excel abrir os acentos corretamente
      baixarArquivo(nomeArquivo("csv"), String.fromCharCode(0xFEFF) + linhas.join("\r\n"),
        "text/csv;charset=utf-8;");
    }

    function escXml(v) {
      return String(v === undefined || v === null ? "" : v)
        .replace(/&/g, "&amp;").replace(/</g, "&lt;")
        .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }

    function anelKML(anel) {
      return anel.map(function (c) { return c[0] + "," + c[1] + ",0"; }).join(" ");
    }

    function geometriaKML(g) {
      if (g.type === "Point") {
        return "<Point><coordinates>" + g.coordinates[0] + "," + g.coordinates[1] + ",0</coordinates></Point>";
      }
      if (g.type === "Polygon") {
        return "<Polygon><outerBoundaryIs><LinearRing><coordinates>" +
          anelKML(g.coordinates[0]) + "</coordinates></LinearRing></outerBoundaryIs></Polygon>";
      }
      if (g.type === "MultiPolygon") {
        return "<MultiGeometry>" + g.coordinates.map(function (poly) {
          return "<Polygon><outerBoundaryIs><LinearRing><coordinates>" +
            anelKML(poly[0]) + "</coordinates></LinearRing></outerBoundaryIs></Polygon>";
        }).join("") + "</MultiGeometry>";
      }
      return "";
    }

    function exportarKML() {
      const feats = todasFeatures;
      if (!feats.length) { alert("Nenhum imóvel carregado para exportar."); return; }

      const marcas = feats.map(function (f) {
        const p = f.properties || {};
        const linhas = [
          "Código: " + (p.codigo || ""),
          "Tipo: " + rotuloTipo(p.tipo),
          "Negócio: " + rotuloNegocio(p.negocio),
          "Preço: " + fmtBRL(p.preco),
          "Endereço: " + (p.endereco || "")
        ].concat(
          Object.keys(p).filter(function (k) { return k.indexOf("spec_") === 0; })
            .map(function (k) { return k.replace("spec_", "").replace(/_/g, " ") + ": " + p[k]; })
        );
        return "  <Placemark>\n" +
          "    <name>" + escXml(p.titulo || p.codigo || "Imóvel") + "</name>\n" +
          "    <description><![CDATA[" + linhas.join("<br/>") + "]]></description>\n" +
          "    " + geometriaKML(f.geometry || {}) + "\n" +
          "  </Placemark>";
      }).join("\n");

      const kml = '<?xml version="1.0" encoding="UTF-8"?>\n' +
        '<kml xmlns="http://www.opengis.net/kml/2.2">\n<Document>\n' +
        "  <name>" + escXml(cliente.marca || "ADMImob") + "</name>\n" +
        marcas + "\n</Document>\n</kml>";

      baixarArquivo(nomeArquivo("kml"), kml, "application/vnd.google-earth.kml+xml");
    }

    document.getElementById("exp-csv").addEventListener("click", function () {
      exportarCSV(); fecharPopovers();
    });
    document.getElementById("exp-kml").addEventListener("click", function () {
      exportarKML(); fecharPopovers();
    });

  })();
  </script>
</body>
